version: '3.8'

# =============================================================================
# docker-compose para VPS DigitalOcean (servidor general + Evolution API)
#
#  app            -> servidor general Laravel 12 (nginx/php-fpm/worker) en el
#                    contenedor construido con el Dockerfile raiz.
#  evolution_api  -> Evolution API (WhatsApp Multi-Device).
#
# La BD + Storage viven en Supabase (remoto). El kiosk-agent NO va en este VPS:
# corre en la PC fisica de cada sucursal.
# =============================================================================

services:
  # ----------------------- SERVICIO 1: Laravel central -----------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiosko_app
    restart: unless-stopped
    # nginx del contenedor escucha internamente en 8080 (docker/nginx.conf).
    # Se expone por el puerto 80 del host. Para HTTPS, un nginx/certbot en el
    # HOST enruta el 443 hacia 127.0.0.1:8080 (ver DEPLOY_DIGITALOCEAN.md).
    ports:
      - "80:8080"
    env_file:
      - .env   # credenciales Supabase/DeepSeek/Gemini/Evolution/IMAP (no versionado)
    volumes:
      - app_storage:/app/storage/app/public
    networks:
      - kiosko-network
    depends_on:
      - evolution_api
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ------------------- SERVICIO 2: Evolution API (WhatsApp) ------------------
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    # NO se publica a la red: Laravel lo llama por DNS interno -> evolution_api:8080.
    environment:
      - AUTHENTICATION_TYPE=apikey
      # CLAVE secreta que Laravel usara como EVOLUTION_API_KEY. CAMBIALA.
      - AUTHENTICATION_API_KEY=cambia_esta_evolution_key_secreta
      - DATABASE_ENABLED=true
      # Evolution guarda llamadas/sesiones en Supabase (mismo proyecto, schema
      # dedicado) usando el pooler modo sesion (puerto 5432). Ejemplo:
      # postgresql://postgres.zzz:PASS@aws-0-us-east-1.pooler.supabase.com:5432/postgres?schema=evolution&sslmode=require
      - DATABASE_CONNECTION_URI=cambia_a_tu_supabase_uri_schema_evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      # Webhook hacia Laravel. En la red docker Evolution alcanza al contenedor
      # "app" por su nombre de servicio y puerto nginx interno 8080:
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://app:8080/webhook-bot
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - kiosko-network

volumes:
  app_storage:
  evolution_data:

networks:
  kiosko-network:
    driver: bridge
